# build.yml - Build the solution and run every test on each push and pull request:
# Debug and Release at /W4 with warnings as errors, a Debug run under AddressSanitizer, a
# Debug build with MSVC static analysis (/analyze), and a Debug run measuring code coverage
# (OpenCppCoverage; the report is the run's "coverage" artifact).
name: Build and test

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    # Windows Server 2025 image: Visual Studio 2026 (MSBuild 18, the v145 toolset the projects use)
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            configuration: Debug
            sanitizer: false
          - name: Release
            configuration: Release
            sanitizer: false
          - name: Debug (AddressSanitizer)
            configuration: Debug
            sanitizer: true
          - name: Debug (static analysis)
            configuration: Debug
            sanitizer: false
            analysis: true
          - name: Debug (coverage)
            configuration: Debug
            sanitizer: false
            coverage: true
    env:
      # vcpkg's binary cache, kept between runs (the GDK, DXC, and DirectXTK12 take a while to build)
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    defaults:
      run:
        shell: pwsh

    steps:
      # The models, sounds, images, and fonts are in Git LFS: without them the asset tests fail
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Check Visual Studio 2026
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $version = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -property installationVersion
          Write-Host "Visual Studio $version"
          if (-not $version -or [version]$version -lt [version]'18.0') {
            throw "The projects need Visual Studio 2026 (v145 toolset); this image has $version"
          }

      - name: Set up vcpkg
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Restore NuGet packages (GoogleTest)
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild LegendsBelow.slnx -t:restore -p:RestorePackagesConfig=true -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Restore failed ($LASTEXITCODE)" }

      - name: Install OpenCppCoverage
        if: matrix.coverage
        run: |
          choco install opencppcoverage -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Installing OpenCppCoverage failed ($LASTEXITCODE)" }
          Add-Content $env:GITHUB_PATH "$env:ProgramFiles\OpenCppCoverage"

      - name: Build and test
        run: |
          $arguments = @{ Configuration = '${{ matrix.configuration }}' }
          if ('${{ matrix.sanitizer }}' -eq 'true') { $arguments.AddressSanitizer = $true }
          if ('${{ matrix.analysis }}' -eq 'true') { $arguments.StaticAnalysis = $true }
          if ('${{ matrix.coverage }}' -eq 'true') { $arguments.Coverage = $true }
          ./Scripts/Test.ps1 @arguments

      - name: Upload the coverage report
        if: matrix.coverage && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: x64/Debug/Coverage/
          if-no-files-found: warn
